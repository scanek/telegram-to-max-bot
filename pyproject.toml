[project]
name = "telegram-to-max-bot"
version = "0.1.0"
description = "Bridge service to forward Telegram messages and media to Max messenger via GREEN-API"
authors = [
    { name = "scanek" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
